# configs/train/sweep_adamw.yaml — AdamW peak-LR sweep. Identical to adamw.yaml except arm, total_tokens, keep_every_tokens, eval_every_tokens.
name: ""
arm: sweep
optimizer: adamw
peak_lr: 2.0e-3
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
total_tokens: 200000000
batch_tokens: 524288
micro_batch: 8
seq_len: 2048
seed: 0
data_dir: data/fineweb_edu
warmup_frac: 0.02
decay_frac: 0.2
grad_clip: 1.0
eval_every_tokens: 25000000
eval_windows: 512
ckpt_every_minutes: 60.0
keep_every_tokens: 0
compile: true
use_doc_mask: true
mem_ceiling_gib: 14.0
log_every_steps: 10
out_root: runs
